[package]
name = "rust_lib_fidokeeper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
zeroize = "1.8"

libloading = "0.8.9"

[build-dependencies]
pkg-config = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
