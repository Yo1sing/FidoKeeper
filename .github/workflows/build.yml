name: build

on:
  push:
    branches: [main]
  # 手动触发，方便验证 workflow 改动而不必推送
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免连续推送堆积任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机开发环境一致；升级时同步改这里和 NDK_VERSION
  FLUTTER_VERSION: 3.47.4
  # 与 flutter.ndkVersion 一致（Flutter 3.47.4 的默认值），cargokit 交叉编译 Rust 需要它
  NDK_VERSION: 28.2.13676358

jobs:
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 不改 pubspec（它仍是版本名的唯一来源），构建时注入：
      #   version name ← pubspec；build number ← 运行号（单调递增，Android versionCode 也用它）；
      #   Linux 包的版本再带短 sha，下载到手也能看出是哪个提交构建的。
      # 注意 --build-name 不能带 `+`：Flutter 会把 name 与 number 拼成 "name+number" 再按 semver
      # 解析，带 `+` 会解析失败并静默退回 1.0.0 / build 0。
      - name: 计算构建版本
        shell: bash
        run: |
          version_name="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          {
            echo "APP_VERSION_NAME=$version_name"
            echo "BUILD_NUMBER=${{ github.run_number }}"
            echo "PACKAGE_VERSION=${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          {
            echo "### 构建版本"
            echo "- 版本名：$version_name"
            echo "- 构建号（Android versionCode / iOS CFBundleVersion）：${{ github.run_number }}"
            echo "- Linux 包版本：${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      # build.rs 在 Linux 上要求 libfido2 >= 1.13.0（Ubuntu 24.04 提供 1.14.0）
      # rpm/binutils/file 供 packaging/linux/build_packages.sh 打 deb、rpm、AppImage
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfido2-dev \
            rpm binutils file ca-certificates

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # cargokit 通过 rustup 安装交叉编译目标，必须保证 rustup 可用
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get
      - run: flutter build linux --release --build-name "$APP_VERSION_NAME" --build-number "$BUILD_NUMBER"

      - name: 下载 appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: 打包 deb / rpm / AppImage
        run: packaging/linux/build_packages.sh build/linux/x64/release/bundle build/linux/packages
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          VERSION: ${{ env.PACKAGE_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: fidokeeper-linux-amd64
          path: build/linux/x64/release/bundle
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fidokeeper-linux-packages
          path: |
            build/linux/packages/*.deb
            build/linux/packages/*.rpm
            build/linux/packages/*.AppImage
          if-no-files-found: error

  windows-amd64:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 不改 pubspec（它仍是版本名的唯一来源），构建时注入：
      #   version name ← pubspec；build number ← 运行号（单调递增，Android versionCode 也用它）；
      #   Linux 包的版本再带短 sha，下载到手也能看出是哪个提交构建的。
      # 注意 --build-name 不能带 `+`：Flutter 会把 name 与 number 拼成 "name+number" 再按 semver
      # 解析，带 `+` 会解析失败并静默退回 1.0.0 / build 0。
      - name: 计算构建版本
        shell: bash
        run: |
          version_name="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          {
            echo "APP_VERSION_NAME=$version_name"
            echo "BUILD_NUMBER=${{ github.run_number }}"
            echo "PACKAGE_VERSION=${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          {
            echo "### 构建版本"
            echo "- 版本名：$version_name"
            echo "- 构建号（Android versionCode / iOS CFBundleVersion）：${{ github.run_number }}"
            echo "- Linux 包版本：${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get
      # fido2/cbor/crypto/zlib 运行库由 windows/cmake/fido_runtime.cmake 从 dll/ 复制到 EXE 旁
      - run: flutter build windows --release --build-name "$env:APP_VERSION_NAME" --build-number "$env:BUILD_NUMBER"

      - name: 生成 Windows exe 安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($iscc) { $iscc = $iscc.Source }
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw '找不到 Inno Setup 的 ISCC.exe' }

          $root = (Resolve-Path '.').Path
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = Join-Path (Resolve-Path 'build/windows').Path 'packages'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $isccArgs = @(
            '/Qp',
            "/DSourceDir=$sourceDir",
            "/DOutputDir=$outputDir",
            "/DIconFile=$root\windows\runner\resources\app_icon.ico",
            "/DAppVersion=$env:APP_VERSION_NAME",
            "/DBuildNumber=$env:BUILD_NUMBER",
            'packaging/windows/fidokeeper.iss'
          )
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: fidokeeper-windows-amd64
          path: build/windows/x64/runner/Release
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fidokeeper-windows-amd64-installer
          path: build/windows/packages/*.exe
          if-no-files-found: error

  android:
    name: Android arm64-v8a / armeabi-v7a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 不改 pubspec（它仍是版本名的唯一来源），构建时注入：
      #   version name ← pubspec；build number ← 运行号（单调递增，Android versionCode 也用它）；
      #   Linux 包的版本再带短 sha，下载到手也能看出是哪个提交构建的。
      # 注意 --build-name 不能带 `+`：Flutter 会把 name 与 number 拼成 "name+number" 再按 semver
      # 解析，带 `+` 会解析失败并静默退回 1.0.0 / build 0。
      - name: 计算构建版本
        shell: bash
        run: |
          version_name="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          {
            echo "APP_VERSION_NAME=$version_name"
            echo "BUILD_NUMBER=${{ github.run_number }}"
            echo "PACKAGE_VERSION=${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          {
            echo "### 构建版本"
            echo "- 版本名：$version_name"
            echo "- 构建号（Android versionCode / iOS CFBundleVersion）：${{ github.run_number }}"
            echo "- Linux 包版本：${version_name}+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 与本地一致的 JDK 21，Gradle 9.3.1 + AGP 9.1 需要 17 以上
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 运行器镜像不一定带 flutter.ndkVersion 指定的 NDK，先装好再交给 Gradle
      - name: 安装 Android NDK
        run: |
          manager="$(command -v sdkmanager || true)"
          if [ -z "$manager" ]; then
            manager="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          yes | "$manager" --install "ndk;${NDK_VERSION}" > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get
      # 必须显式指定 ABI：默认只打当前连接设备那一种，且每个 ABI 需要各自的 Rust 产物
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name "$APP_VERSION_NAME" --build-number "$BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: fidokeeper-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
